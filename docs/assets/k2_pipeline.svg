<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="786" viewBox="0 0 1600 786">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker>
  <marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker>
</defs>
<rect width="1600" height="786" fill="#ffffff"/>
<text x="40" y="52" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="40" dy="0">Refugio: the data pipeline for Culiacán</tspan></text>
<text x="40" y="82" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="40" dy="0">Downloaded from Amazon S3 in 34 s, computed in 2.1 s on a laptop. Every number is from stats.json.</tspan></text>
<text x="40" y="130" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start"><tspan x="40" dy="0">STAGE</tspan></text>
<text x="190" y="130" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start"><tspan x="190" dy="0">IN</tspan></text>
<text x="560" y="130" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start"><tspan x="560" dy="0">STEP</tspan></text>
<text x="1010" y="130" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start"><tspan x="1010" dy="0">OUT</tspan></text>
<rect x="30" y="148" width="1540" height="104" rx="10" fill="#fbfbfa" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="48" y="194" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="48" dy="0">Places</tspan></text>
<text x="48" y="220" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="48" dy="0">download 4 s</tspan></text>
<rect x="190" y="164" width="330" height="72" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="206" y="190" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="206" dy="0">Overture Maps places</tspan></text>
<text x="206" y="214" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="206" dy="0">28,002 places in the bounding box</tspan></text>
<polyline points="522,200 556,200" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<text x="574" y="195.45000000000002" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="574" dy="0">Classify by category and brand; drop closed, low-</tspan><tspan x="574" dy="18.900000000000002">confidence and known mistakes</tspan></text>
<polyline points="972,200 1006,200" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="1010" y="164" width="540" height="72" rx="6" fill="#eaf2fc" stroke="#1c5cab" stroke-width="1.5"/>
<text x="1026" y="205.25" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c5cab" text-anchor="start"><tspan x="1026" dy="0">211 refuges, 366 quick stops, 197 candidate public buildings</tspan></text>
<rect x="30" y="266" width="1540" height="104" rx="10" fill="#fbfbfa" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="48" y="312" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="48" dy="0">Streets</tspan></text>
<text x="48" y="338" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="48" dy="0">download 18 s</tspan></text>
<rect x="190" y="282" width="330" height="72" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="206" y="308" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="206" dy="0">Overture Maps road segments</tspan></text>
<text x="206" y="332" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="206" dy="0">49,024 segments</tspan></text>
<polyline points="522,318 556,318" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<text x="574" y="322.9" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="574" dy="0">Split at connectors into a walking graph; no motorways</tspan></text>
<polyline points="972,318 1006,318" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="1010" y="282" width="540" height="72" rx="6" fill="#eaf2fc" stroke="#1c5cab" stroke-width="1.5"/>
<text x="1026" y="323.25" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c5cab" text-anchor="start"><tspan x="1026" dy="0">39,069 intersections, 57,276 street edges, 4,567 km</tspan></text>
<rect x="30" y="384" width="1540" height="104" rx="10" fill="#fbfbfa" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="48" y="430" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="48" dy="0">People</tspan></text>
<text x="48" y="456" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="48" dy="0">download 2 s</tspan></text>
<rect x="190" y="400" width="330" height="72" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="206" y="426" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="206" dy="0">Meta HRSL, total and 60+</tspan></text>
<text x="206" y="450" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="206" dy="0">90,767 populated 30 m pixels</tspan></text>
<polyline points="522,436 556,436" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<text x="574" y="440.9" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="574" dy="0">Sum into H3 hexagons inside the city (138.1 km²)</tspan></text>
<polyline points="972,436 1006,436" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="1010" y="400" width="540" height="72" rx="6" fill="#eaf2fc" stroke="#1c5cab" stroke-width="1.5"/>
<text x="1026" y="441.25" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c5cab" text-anchor="start"><tspan x="1026" dy="0">6,932 hexagons, 723,131 people, 55,485 aged 60+</tspan></text>
<rect x="30" y="502" width="1540" height="104" rx="10" fill="#fbfbfa" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="48" y="548" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="48" dy="0">Walk</tspan></text>
<rect x="190" y="518" width="330" height="72" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="206" y="544" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="206" dy="0">Graph + refuges + hexagons</tspan></text>
<text x="206" y="568" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="206" dy="0">211 refuges as sources</tspan></text>
<polyline points="522,554 556,554" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<text x="574" y="558.9" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="574" dy="0">One multi-source Dijkstra at 3.6 km/h, door to door</tspan></text>
<polyline points="972,554 1006,554" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="1010" y="518" width="540" height="72" rx="6" fill="#eaf2fc" stroke="#1c5cab" stroke-width="1.5"/>
<text x="1026" y="549.125" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c5cab" text-anchor="start"><tspan x="1026" dy="0">Walking minutes for every hexagon: 17,441 older adults more</tspan><tspan x="1026" dy="20.25">than 15 min away</tspan></text>
<rect x="30" y="620" width="1540" height="104" rx="10" fill="#fbfbfa" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="48" y="666" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="48" dy="0">Propose</tspan></text>
<rect x="190" y="636" width="330" height="72" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1.5"/>
<text x="206" y="662" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#6b7280" text-anchor="start"><tspan x="206" dy="0">Candidate public buildings</tspan></text>
<text x="206" y="686" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#232f3e" text-anchor="start"><tspan x="206" dy="0">197 candidates</tspan></text>
<polyline points="522,672 556,672" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<text x="574" y="667.4499999999999" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start"><tspan x="574" dy="0">Greedy maximum coverage, 10-minute walk, weighted by</tspan><tspan x="574" dy="18.900000000000002">older adults</tspan></text>
<polyline points="972,672 1006,672" fill="none" stroke="#232f3e" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="1010" y="636" width="540" height="72" rx="6" fill="#eaf2fc" stroke="#1c5cab" stroke-width="1.5"/>
<text x="1026" y="677.25" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1c5cab" text-anchor="start"><tspan x="1026" dy="0">10 proposals: 40.7% → 51.6% of older adults within 10 min</tspan></text>
<text x="40" y="760" font-family="Noto Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start"><tspan x="40" dy="0">Output: hex.json, refuges.geojson, proposals.geojson and stats.json, served as static files by AWS Amplify. Sources: Overture Maps Foundation, Meta and CIESIN HRSL.</tspan></text>
</svg>
